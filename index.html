<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GTech – Access control &amp; security solutions, Dubai UAE</title>
    <meta
      name="description"
      content="GTech designs, installs and supports access control, biometrics, turnstiles, barriers and CCTV systems in Dubai and across the UAE."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e31e24'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0d11;
        --p: #12151a;
        --p2: #181c22;
        --l: #252a33;
        --t: #eceef2;
        --m: #9aa2ae;
        --red: #e31e24;
        --g: #2ddc7f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font:
          16px/1.6 "DM Sans",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--t);
        overflow-x: hidden;
      }
      h1,
      h2,
      h3 {
        font-family: Sora, sans-serif;
        line-height: 1.12;
        letter-spacing: -0.02em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1200px;
        margin: auto;
        padding: 0 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 10px;
        border: 1px solid transparent;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        background: none;
      }
      .btn.p {
        background: var(--red);
        color: #fff;
      }
      .btn.p:hover {
        background: #c8151b;
        transform: translateY(-2px);
        box-shadow: 0 10px 28px #e31e2460;
      }
      .btn.g {
        border-color: var(--l);
        background: var(--p2);
      }
      .btn.g:hover {
        border-color: #555d6b;
      }
      /* header */
      header {
        position: sticky;
        top: 0;
        z-index: 60;
        background: #0b0d11e6;
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--l);
      }
      header .wrap {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 70px;
      }
      .logo {
        font: 800 22px Sora;
        letter-spacing: 0.14em;
      }
      .logo b {
        color: var(--red);
      }
      .logo small {
        display: block;
        font: 500 8px "DM Sans";
        letter-spacing: 0.3em;
        color: var(--m);
        margin-top: -3px;
      }
      header nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
        align-items: center;
      }
      nav > div {
        position: relative;
      }
      nav > div > a {
        display: block;
        white-space: nowrap;
        padding: 10px 10px;
        font-size: 13.5px;
        font-weight: 500;
        color: #c7ccd5;
        border-radius: 8px;
        transition: 0.2s;
      }
      nav > div:hover > a,
      nav > div > a.on {
        color: #fff;
        background: var(--p2);
      }
      .dd {
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 250px;
        background: var(--p);
        border: 1px solid var(--l);
        border-radius: 12px;
        padding: 8px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
        transition: 0.2s;
        box-shadow: 0 24px 60px #000a;
      }
      nav > div:hover .dd {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .dd a {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
        color: #c7ccd5;
      }
      .dd a:hover {
        background: var(--p2);
        color: #fff;
      }
      .dd svg {
        width: 20px;
        stroke: var(--red);
      }
      .tel {
        font-size: 13px;
        color: var(--m);
        white-space: nowrap;
      }
      .qb {
        position: relative;
      }
      .qb i {
        position: absolute;
        top: -8px;
        right: -8px;
        min-width: 20px;
        height: 20px;
        border-radius: 99px;
        background: #fff;
        color: var(--red);
        font: 700 11px "DM Sans";
        display: grid;
        place-items: center;
      }
      .bg {
        display: none;
        background: none;
        border: 0;
        font-size: 26px;
        cursor: pointer;
        margin-left: auto;
      }
      @media (max-width: 1020px) {
        .tel {
          display: none;
        }
        header nav {
          position: fixed;
          inset: 70px 0 auto;
          background: var(--p);
          flex-direction: column;
          align-items: stretch;
          padding: 14px;
          transform: translateY(-140%);
          transition: 0.3s;
          margin: 0;
          max-height: 80vh;
          overflow: auto;
        }
        header nav.open {
          transform: none;
        }
        .dd {
          display: none;
        }
        .bg {
          display: block;
        }
        .qb {
          display: none;
        }
      }
      svg.i {
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke: currentColor;
      }
      /* hero */
      .hero {
        position: relative;
        overflow: hidden;
        background: radial-gradient(
          800px 500px at 78% 30%,
          #e31e2426,
          transparent 65%
        );
      }
      .hero:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px) 0 0/46px 46px,
          linear-gradient(90deg, #ffffff08 1px, transparent 1px) 0 0/46px 46px;
        mask-image: radial-gradient(circle at 72% 40%, #000, transparent 72%);
      }
      .hero .wrap {
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 30px;
        align-items: center;
        padding: 80px 20px 90px;
      }
      .hero h1 {
        font-size: clamp(36px, 5.6vw, 68px);
        margin: 18px 0;
      }
      .hero p {
        color: var(--m);
        font-size: 18px;
        max-width: 520px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 99px;
        border: 1px solid var(--l);
        background: var(--p);
        font-size: 13px;
        color: #cfd4dc;
      }
      .chip:before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--g);
        animation: pl 2s infinite;
      }
      @keyframes pl {
        0% {
          box-shadow: 0 0 0 0 #2ddc7f99;
        }
        80%,
        100% {
          box-shadow: 0 0 0 10px #0000;
        }
      }
      .cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 30px;
      }
      .vis {
        position: relative;
        height: 460px;
        display: grid;
        place-items: center;
      }
      .vis svg.big {
        width: min(400px, 92%);
        overflow: visible;
      }
      .rot {
        transform-origin: 100px 100px;
        animation: rt 24s linear infinite;
      }
      .rot2 {
        transform-origin: 100px 100px;
        animation: rt 16s linear infinite reverse;
      }
      @keyframes rt {
        to {
          transform: rotate(360deg);
        }
      }
      .scan {
        animation: sc 3.2s ease-in-out infinite;
      }
      @keyframes sc {
        0%,
        100% {
          transform: translateY(40px);
        }
        50% {
          transform: translateY(150px);
        }
      }
      .fb {
        position: absolute;
        padding: 9px 14px;
        border-radius: 12px;
        background: #12151acc;
        backdrop-filter: blur(10px);
        border: 1px solid var(--l);
        font-size: 13px;
        font-weight: 500;
        display: flex;
        gap: 8px;
        align-items: center;
        animation: fl 6s ease-in-out infinite;
      }
      .fb:before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--g);
      }
      .fb.a {
        left: 0;
        top: 60px;
      }
      .fb.b {
        right: 0;
        top: 190px;
        animation-delay: -2s;
      }
      .fb.c {
        left: 6%;
        bottom: 50px;
        animation-delay: -4s;
      }
      @keyframes fl {
        50% {
          transform: translateY(-10px);
        }
      }
      @media (max-width: 900px) {
        .hero .wrap {
          grid-template-columns: 1fr;
          padding-top: 50px;
        }
        .vis {
          height: 380px;
        }
      }
      /* marquee */
      .mq {
        border-block: 1px solid var(--l);
        background: var(--p);
        overflow: hidden;
        padding: 15px 0;
      }
      .mq div {
        display: flex;
        gap: 44px;
        width: max-content;
        animation: mq 38s linear infinite;
        color: var(--m);
        font: 500 14px Sora;
        white-space: nowrap;
      }
      .mq span:before {
        content: "◆";
        color: var(--red);
        margin-right: 44px;
        font-size: 9px;
      }
      @keyframes mq {
        to {
          transform: translateX(-50%);
        }
      }
      section {
        padding: 90px 0;
      }
      .h {
        margin-bottom: 34px;
        max-width: 680px;
      }
      .h h2 {
        font-size: clamp(28px, 4vw, 44px);
        margin-bottom: 12px;
      }
      .h p {
        color: var(--m);
      }
      /* tiles */
      .tiles {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
      .tile {
        grid-column: span 2;
        position: relative;
        border: 1px solid var(--l);
        border-radius: 20px;
        padding: 28px;
        background: var(--p);
        overflow: hidden;
        transition: 0.3s;
        min-height: 210px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        --x: 50%;
        --y: 50%;
      }
      .tile:first-child {
        grid-column: span 4;
      }
      .tile:before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          260px circle at var(--x) var(--y),
          #e31e2430,
          transparent
        );
        opacity: 0;
        transition: 0.3s;
      }
      .tile:hover:before {
        opacity: 1;
      }
      .tile:hover {
        border-color: #e31e2480;
        transform: translateY(-4px);
      }
      .tile > svg.i {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 64px;
        color: #3a414d;
        transition: 0.4s;
      }
      .tile:hover > svg.i {
        color: var(--red);
        transform: scale(1.15) rotate(-6deg);
      }
      .tile h3 {
        font-size: 22px;
        position: relative;
      }
      .tile p {
        font-size: 14px;
        color: var(--m);
        position: relative;
      }
      .tile em {
        font-style: normal;
        color: var(--red);
        font-weight: 700;
        font-size: 13px;
        position: relative;
        margin-top: 8px;
      }
      @media (max-width: 800px) {
        .tiles {
          grid-template-columns: 1fr 1fr;
        }
        .tile,
        .tile:first-child {
          grid-column: span 2;
        }
      }
      /* live demo */
      .demo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .card {
        border: 1px solid var(--l);
        border-radius: 20px;
        background: var(--p);
        padding: 28px;
      }
      .door {
        display: grid;
        place-items: center;
        text-align: center;
        gap: 10px;
        min-height: 290px;
        transition: 0.4s;
        border-radius: 16px;
        border: 1px solid var(--l);
        background: var(--p2);
        position: relative;
        overflow: hidden;
      }
      .door svg {
        width: 84px;
        transition: 0.4s;
      }
      .door .sh {
        transition: 0.4s;
        transform-origin: 32px 26px;
      }
      .door.ok {
        border-color: var(--g);
        box-shadow: 0 0 50px #2ddc7f33 inset;
        color: var(--g);
      }
      .door.ok .sh {
        transform: translateY(-6px) rotate(-30deg);
      }
      .door.no {
        border-color: var(--red);
        color: var(--red);
        animation:
          sk 0.5s,
          al 1s 2;
      }
      .door b {
        font: 700 20px Sora;
      }
      @keyframes sk {
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      @keyframes al {
        50% {
          background: #e31e2422;
        }
      }
      .ctl {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .log {
        list-style: none;
        padding: 0;
        font:
          13px/1.4 ui-monospace,
          Menlo,
          monospace;
        display: grid;
        gap: 8px;
      }
      .log li {
        padding: 9px 12px;
        border-radius: 8px;
        background: var(--p2);
        border-left: 3px solid var(--g);
        animation: li 0.4s;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .log li.n {
        border-color: var(--red);
        color: #ff7a7e;
      }
      @keyframes li {
        from {
          opacity: 0;
          transform: translateX(-12px);
        }
      }
      .feat {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }
      .feat span {
        font-size: 13px;
        color: var(--m);
        padding: 10px;
        border: 1px solid var(--l);
        border-radius: 10px;
        text-align: center;
      }
      @media (max-width: 850px) {
        .demo {
          grid-template-columns: 1fr;
        }
        .feat {
          grid-template-columns: 1fr 1fr;
        }
      }
      /* projects */
      .pj {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 18px;
      }
      .pf {
        border: 1px solid var(--l);
        border-radius: 20px;
        padding: 34px;
        min-height: 340px;
        background: linear-gradient(150deg, #1b1f26, #0f1216);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        overflow: hidden;
      }
      .pf:before {
        content: "";
        position: absolute;
        right: -60px;
        top: -60px;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        border: 1px solid #e31e2455;
        box-shadow:
          0 0 0 40px #e31e2410,
          0 0 0 80px #e31e2408;
      }
      .tg {
        display: inline-block;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 99px;
        background: #e31e2422;
        color: #ff8a8d;
        margin-bottom: 12px;
        width: max-content;
      }
      .pf h3 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .pf p {
        color: var(--m);
      }
      .pf ul {
        margin: 14px 0 0 18px;
        color: #c7ccd5;
        font-size: 14px;
      }
      .pl {
        display: grid;
        gap: 18px;
      }
      .ps {
        border: 1px solid var(--l);
        border-radius: 16px;
        padding: 22px;
        background: var(--p);
        transition: 0.25s;
      }
      .ps:hover {
        border-color: #e31e2466;
        transform: translateX(4px);
      }
      .ps h3 {
        font-size: 17px;
      }
      .ps p {
        font-size: 14px;
        color: var(--m);
      }
      .logos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 22px;
      }
      .logos div {
        height: 72px;
        border: 1px dashed #3a414d;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #6b7380;
        font: 700 13px Sora;
        letter-spacing: 0.12em;
        transition: 0.25s;
      }
      .logos div:hover {
        color: #fff;
        border-color: var(--red);
      }
      @media (max-width: 850px) {
        .pj {
          grid-template-columns: 1fr;
        }
      }
      .ceo {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--l);
        border-radius: 28px;
        padding: 64px 56px;
        background:
          radial-gradient(520px 300px at 0 0, #e31e2428, transparent), var(--p);
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 44px;
        align-items: center;
      }
      .ceo .sh {
        position: relative;
        display: grid;
        place-items: center;
        height: 150px;
      }
      .ceo .sh svg {
        width: 96px;
        color: var(--red);
        position: relative;
      }
      .ceo .sh span {
        position: absolute;
        inset: 0;
        border: 1px solid #e31e2466;
        border-radius: 50%;
        animation: rg 3.5s infinite;
      }
      .ceo .sh span + span {
        animation-delay: 1.2s;
      }
      .ceo blockquote {
        font:
          600 clamp(22px, 3vw, 34px)/1.35 Sora,
          sans-serif;
        letter-spacing: -0.01em;
      }
      .ceo blockquote i {
        font-style: normal;
        display: inline-block;
        opacity: 0.12;
        transform: translateY(6px);
        transition:
          opacity 0.5s,
          transform 0.5s,
          color 0.5s;
        margin-right: 0.25em;
      }
      .ceo blockquote.on i {
        opacity: 1;
        transform: none;
      }
      .who {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 28px;
      }
      .av {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--p2);
        border: 1px solid var(--l);
        display: grid;
        place-items: center;
        font: 700 16px Sora;
        overflow: hidden;
        position: relative;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .who b {
        display: block;
      }
      .who small {
        color: var(--m);
      }
      @media (max-width: 800px) {
        .ceo {
          grid-template-columns: 1fr;
          padding: 36px 24px;
          gap: 10px;
        }
        .ceo .sh {
          height: 110px;
          justify-content: start;
        }
      }
      /* services */
      .sv {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 20px;
      }
      .tabs {
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .tab {
        text-align: left;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid var(--l);
        background: var(--p);
        cursor: pointer;
        font-weight: 700;
        transition: 0.2s;
      }
      .tab.on {
        border-color: var(--red);
        background: #e31e2418;
      }
      .sp {
        min-height: 300px;
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 20px;
        align-items: center;
      }
      .sp ul {
        margin: 14px 0 0 18px;
        color: #c7ccd5;
      }
      .sp svg {
        width: 130px;
        color: var(--red);
        animation: fl 5s infinite;
      }
      .sp p {
        color: var(--m);
      }
      .sp h3 {
        font-size: 26px;
        margin-bottom: 10px;
      }
      @media (max-width: 800px) {
        .sv {
          grid-template-columns: 1fr;
        }
        .tabs {
          grid-auto-flow: column;
          overflow: auto;
        }
        .sp {
          grid-template-columns: 1fr;
        }
        .sp svg {
          display: none;
        }
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
      }
      .stats b {
        font: 800 clamp(34px, 5vw, 54px) Sora;
        color: var(--red);
        display: block;
      }
      .stats span {
        color: var(--m);
        font-size: 14px;
      }
      .band {
        border: 1px solid var(--l);
        border-radius: 24px;
        padding: 48px;
        background:
          radial-gradient(500px 240px at 100% 0, #e31e2430, transparent),
          var(--p);
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      .band h2 {
        font-size: clamp(26px, 3.5vw, 38px);
        max-width: 560px;
      }
      /* catalog */
      .ph {
        padding: 56px 0 30px;
        background: radial-gradient(
          700px 260px at 85% 0,
          #e31e2422,
          transparent
        );
      }
      .ph h1 {
        font-size: clamp(32px, 5vw, 54px);
        margin: 10px 0;
      }
      .ph p {
        color: var(--m);
        max-width: 620px;
      }
      .bc {
        font-size: 13px;
